name: Vedic Devlopment Testing

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

jobs:
    Test:
        runs-on: ubuntu-latest

        steps:
            - name: check out branch
              uses: actions/checkout@v6

            - name: Install Rust
              uses: actions-rs/toolchain@v1
              with:
                  profile: minimal
                  toolchain: stable

            - name: Install nightly formatter
              uses: actions-rs/toolchain@v1
              with:
                  profile: minimal
                  toolchain: nightly
                  components: rustfmt
                  override: false

            - name: Check formatting
              run: cargo +nightly fmt --all -- --check

            - name: Run Rust tests
              run: cargo test --workspace

            - name: Build and run language tests
              run: python tools -bt
