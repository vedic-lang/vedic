[package]
name = "vedic-core"
version = "3.0.0"
edition = "2021"

[dependencies]
unicode-width = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semver = "1"
toml_edit = "0.22"
mimalloc = { version = "0.1.39", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3.37", features = ["console"] }
wasm-bindgen = "0.2.37"
wee_alloc = "0.4.5"
